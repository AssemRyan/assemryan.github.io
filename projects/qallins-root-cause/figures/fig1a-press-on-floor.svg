<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" class="qfig" role="img" aria-label="Schematic illustration: nail-making press standing directly on the floor, vibrations feed back into the machine">
<style>
.qbg{fill:var(--card,#fff)}.qln{stroke:var(--ink,#0f172a);stroke-width:2;fill:none}.qthin{stroke:var(--muted,#5b6578);stroke-width:1.2;fill:none}
.qmach{fill:var(--chip,#eaf2fb);stroke:var(--brand,#0f4c81);stroke-width:2}.qsteel{fill:var(--muted,#5b6578)}.qhatch{stroke:var(--muted,#5b6578);stroke-width:1;opacity:.45}
.qh{font:700 15px system-ui,"Segoe UI",Arial,sans-serif}.qt{fill:var(--ink,#0f172a);font:600 13px system-ui,"Segoe UI",Arial,sans-serif}.qs{fill:var(--muted,#5b6578);font:italic 11.5px system-ui,"Segoe UI",Arial,sans-serif}
.qbad{stroke:#d64545;stroke-width:2.5;fill:none}.qbadf{fill:#d64545}.qok{stroke:#1f9d55;stroke-width:2.5;fill:none}.qokf{fill:#1f9d55}
.qrub{fill:#334155;stroke:var(--ink,#0f172a);stroke-width:1.2}.qlaser{stroke:#e5484d;stroke-width:2.5;stroke-dasharray:9 5;fill:none}
/*F*/.qfig .de{display:none}/*F*/
</style>
<defs>
<marker id="q1a-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="qbadf"/></marker>
<pattern id="q1a-h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="qhatch"/></pattern>
</defs>
<rect width="400" height="300" class="qbg"/>
<text x="16" y="27" class="qh qbadf en">Before: standing directly on the floor</text>
<text x="16" y="27" class="qh qbadf de">Vorher: direkt auf dem Boden</text>
<text x="16" y="45" class="qs en">schematic illustration</text>
<text x="16" y="45" class="qs de">schematische Darstellung</text>
<!-- floor -->
<rect x="0" y="236" width="400" height="34" fill="url(#q1a-h)"/>
<line x1="0" y1="236" x2="400" y2="236" class="qln"/>
<!-- machine -->
<rect x="120" y="92" width="170" height="122" rx="8" class="qmach"/>
<rect x="108" y="214" width="194" height="12" rx="2" class="qmach"/>
<rect x="118" y="226" width="24" height="10" class="qsteel"/>
<rect x="268" y="226" width="24" height="10" class="qsteel"/>
<circle cx="164" cy="140" r="30" class="qmach"/><circle cx="164" cy="140" r="6" class="qsteel"/>
<line x1="164" y1="140" x2="230" y2="134" class="qthin"/>
<rect x="226" y="122" width="48" height="26" rx="3" class="qmach"/>
<text x="205" y="196" text-anchor="middle" class="qt en">Nail press</text>
<text x="205" y="196" text-anchor="middle" class="qt de">Nagelpresse</text>
<!-- vibration feeding back -->
<line x1="130" y1="266" x2="130" y2="242" class="qbad" marker-end="url(#q1a-ar)"/>
<line x1="280" y1="266" x2="280" y2="242" class="qbad" marker-end="url(#q1a-ar)"/>
<path d="M104,112 q-9,10 0,20 q9,10 0,20 q-9,10 0,20" class="qbad"/>
<path d="M90,118 q-9,10 0,20 q9,10 0,20" class="qbad" opacity=".55"/>
<path d="M306,112 q9,10 0,20 q-9,10 0,20 q9,10 0,20" class="qbad"/>
<path d="M320,118 q9,10 0,20 q-9,10 0,20" class="qbad" opacity=".55"/>
<text x="394" y="108" text-anchor="end" class="qt qbadf en">vibration</text>
<text x="394" y="108" text-anchor="end" class="qt qbadf de">Schwingung</text>
<text x="200" y="291" text-anchor="middle" class="qt en">No damping → vibrations feed back into the machine</text>
<text x="200" y="291" text-anchor="middle" class="qt de">Keine Dämpfung → Schwingungen wirken zurück</text>
</svg>
